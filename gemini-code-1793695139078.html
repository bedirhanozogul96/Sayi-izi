<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meka-Matematik (Kinetic-Cog)</title>
    <style>
        /* Apple Tasarım Dili (San Francisco Font, Yumuşak Renkler) */
        :root {
            --apple-bg: #F2F2F7;
            --apple-white: #FFFFFF;
            --apple-blue: #007AFF;
            --apple-green: #34C759;
            --apple-red: #FF3B30;
            --apple-text: #1D1D1F;
            --apple-gray: #8E8E93;
            --apple-light-gray: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Glassmorphism Giriş Ekranı */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: var(--apple-white);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
        }

        .login-box h1 { 
            margin: 0 0 24px 0; 
            font-size: 28px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        #kullaniciAdiInput { 
            width: 100%;
            padding: 16px; 
            font-size: 18px; 
            border-radius: 12px; 
            border: 1px solid var(--apple-light-gray); 
            background: var(--apple-bg);
            margin-bottom: 20px; 
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        #kullaniciAdiInput:focus {
            border-color: var(--apple-blue);
        }

        #baslaBtn { 
            width: 100%;
            padding: 16px; 
            font-size: 18px; 
            background: var(--apple-blue); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600;
            transition: opacity 0.2s;
        }
        #baslaBtn:active { opacity: 0.7; }

        /* iOS Tarzı Segmented Control (Üst Menü) */
        .header {
            margin-top: 30px;
            background-color: rgba(118, 118, 128, 0.12);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            gap: 4px;
        }

        .mode-btn {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            color: var(--apple-text);
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-btn.active { 
            background-color: var(--apple-white); 
            box-shadow: 0 3px 8px rgba(0,0,0,0.12); 
        }

        /* Soru ve Uyarı Metinleri */
        #questionDisplay {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 30px 0 10px 0;
            height: 50px;
        }
        
        #warningMsg {
            color: var(--apple-red);
            font-weight: 500;
            font-size: 17px;
            height: 24px;
            margin-bottom: 10px;
        }

        /* Şekil Konteyneri (Apple Card Style) */
        .shapes-container {
            display: flex;
            gap: 20px;
            margin: 10px 0 30px 0;
            min-height: 80px;
            padding: 20px 30px;
            background: var(--apple-white);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .shape {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 700;
            color: white;
            cursor: grab;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        .shape:active { transform: scale(0.95); cursor: grabbing; }

        /* 1-10 Arası Geometrik Şekiller */
        .shape[data-val="1"] { background: #FF3B30; border-radius: 50%; } 
        .shape[data-val="2"] { background: #FF9500; border-radius: 50% 0 50% 0; } 
        .shape[data-val="3"] { background: transparent; width: 0; height: 0; border-left: 35px solid transparent; border-right: 35px solid transparent; border-bottom: 60px solid #FFCC00; color: #1D1D1F; box-shadow: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
        .shape[data-val="3"] span { position: absolute; top: 25px; left: -8px;}
        .shape[data-val="4"] { background: #34C759; border-radius: 12px; } 
        .shape[data-val="5"] { background: #30B0C7; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); } 
        .shape[data-val="6"] { background: #007AFF; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); } 
        .shape[data-val="7"] { background: #5856D6; clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%); } 
        .shape[data-val="8"] { background: #AF52DE; clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); } 
        .shape[data-val="9"] { background: #FF2D55; clip-path: polygon(50% 0%, 83% 12%, 100% 43%, 94% 78%, 68% 100%, 32% 100%, 6% 78%, 0% 43%, 17% 12%); } 
        .shape[data-val="10"] { background: #1D1D1F; clip-path: polygon(50% 0%, 81% 10%, 100% 35%, 100% 65%, 81% 90%, 50% 100%, 19% 90%, 0% 65%, 0% 35%, 19% 10%); } 

        /* Sayı Doğrusu (Apple Card Style) */
        .number-line-wrapper {
            margin-top: 10px;
            position: relative;
            width: 900px;
            height: 120px;
            background: var(--apple-white);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            display: flex;
            align-items: flex-end;
            padding-bottom: 20px;
            box-sizing: border-box;
        }

        .drop-zone {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            border-right: 1px solid var(--apple-light-gray);
        }
        .drop-zone:last-child { border-right: none; }

        .number-label {
            font-size: 20px;
            font-weight: 600;
            color: var(--apple-gray);
            margin-top: 10px;
        }

        .trail-shape {
            position: absolute;
            bottom: 45px;
            width: 40px;
            height: 40px;
            opacity: 0.3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        /*
