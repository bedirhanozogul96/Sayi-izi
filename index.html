<!-- ================= GİRİŞ ================= -->
<section id="login">
  <button class="plain corner themeBtn" onclick="toggleTheme()" aria-label="Görünüm"></button>
  <div class="login-box">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 50 50" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 34h38" stroke-width="3"/><path d="M10 30v8M25 30v8M40 30v8" stroke-width="2.6"/>
        <path d="M10 26c4-12 11-12 15 0M25 26c4-12 11-12 15 0" stroke-width="3"/><path d="M37 22l3 4 3-4" stroke-width="2.6"/>
      </svg>
    </div>
    <h1>Sayı İzi</h1>
    <p class="sub">Sayı doğrusunda toplama ve çıkarma</p>
    <div class="seg wide big" id="roleSeg">
      <button data-role="ogrenci" class="on">Öğrenci</button>
      <button data-role="ogretmen">Öğretmen</button>
      <button data-role="yonetici">Yönetici</button>
    </div>

    <!-- Öğrenci Giriş Formu -->
    <div id="studentForm">
      <div class="group-title">Öğrenci girişi</div>
      <div class="group">
        <div class="row"><input class="field" id="inName" placeholder="Adın" autocomplete="off" autocapitalize="words"></div>
        <div class="row"><input class="field" id="inCode" placeholder="Oturum kodu (6 hane)" maxlength="6" inputmode="numeric" autocomplete="off"></div>
      </div>
    </div>

    <!-- Öğretmen Giriş Formu (Ad + Özel Kod) -->
    <div id="teacherForm" class="hidden">
      <div class="group-title">Öğretmen girişi</div>
      <div class="group">
        <div class="row"><input class="field" id="inTeacher" placeholder="Öğretmen adınız" autocomplete="off" autocapitalize="words"></div>
        <div class="row"><input class="field" id="inTeacherCode" placeholder="Öğretmen erişim kodu (6 hane)" maxlength="6" inputmode="numeric" autocomplete="off"></div>
      </div>
    </div>

    <!-- Yönetici Giriş Formu -->
    <div id="adminForm" class="hidden">
      <div class="group-title">Yönetici girişi</div>
      <div class="group">
        <div class="row"><input type="password" class="field" id="inAdminPass" placeholder="Yönetici şifresi" autocomplete="off"></div>
      </div>
    </div>

    <button class="btn block" id="loginBtn" onclick="login()">Başla</button>
    <p class="login-err" id="loginMsg"></p>

    <!-- YÖNETİCİ PANELİ (Şifre doğrulandığında açılır) -->
    <div id="adminPanel" class="hidden" style="margin-top:24px">
      <div class="group-title">Yeni Öğretmen Yetkilendir</div>
      <div class="group">
        <div class="row"><input class="field" id="newTeacherName" placeholder="Öğretmen Adı Soyadı" autocapitalize="words"></div>
        <div class="row" style="padding:10px 12px">
          <button class="btn tinted block" onclick="createTeacherCode()">Öğretmen Kodu Üret ve Kaydet</button>
        </div>
      </div>
      <div class="group-title">Kayıtlı Öğretmenler ve Kodları</div>
      <div class="group code-list" id="teacherCodeList">
        <div class="empty">Henüz öğretmen eklenmedi.</div>
      </div>
    </div>
  </div>
</section>
